[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-exam-demo"
version = "0.2.0"
description = "SDN demo that prioritizes online exam traffic under congestion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10,<4",
  "pandas>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "mypy>=1.20",
  "pip-audit>=2.10,<3",
  "pytest>=9.0",
  "ruff>=0.14",
]
controller-pypi = [
  "os-ken==4.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
  ".mypy_cache",
  ".openssl",
  ".openssl.copy",
  ".pytest_cache",
  ".python312",
  ".python_src",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "mininet-src",
  "results",
  "venv",
  "venv310",
  "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"mininet/*.py" = ["E402"]
"ryu_app/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
ignore_missing_imports = true
strict = false
